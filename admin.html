<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notice Board — Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: radial-gradient(1200px 800px at 70% 20%, #24334f 0%, #141c2e 55%, #0d1322 100%);
    color: #fff; overflow-x: hidden; overflow-y: auto; min-height: 100%;
  }
  #admin { max-width: 920px; margin: 0 auto; padding: 30px 22px 60px; }
  .card {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px; padding: 22px; margin-bottom: 20px;
  }
  .card h3 { margin-bottom: 14px; font-size: 20px; }
  .card label { display: block; font-size: 13px; opacity: .75; margin: 12px 0 5px; }
  .card input[type=text], .card input[type=number], .card input[type=password], .card textarea {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.2);
    background: rgba(0,0,0,.3); color: #fff; font-size: 15px; font-family: inherit;
  }
  .card textarea { min-height: 80px; resize: vertical; }
  .row { display: flex; gap: 12px; } .row > * { flex: 1; }
  .btn {
    display: inline-block; padding: 10px 20px; border-radius: 8px; border: none;
    font-size: 15px; font-weight: 600; cursor: pointer; margin: 6px 6px 0 0;
  }
  .btn.primary { background: #2f7fe0; color: #fff; }
  .btn.ghost { background: rgba(255,255,255,.12); color: #fff; }
  .btn.danger { background: #e05252; color: #fff; }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  .btn.armed { background: #dc2626 !important; color: #fff !important; }
  .notice-item {
    background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
  }
  .notice-item .ni-title { font-weight: 700; font-size: 16px; }
  .notice-item .ni-body { opacity: .8; font-size: 14px; margin: 4px 0 8px; white-space: pre-line; }
  .notice-item.inactive { opacity: .45; }
  .hint { font-size: 13px; opacity: .65; margin-top: 8px; line-height: 1.5; }
  /* PIN gate */
  #pin-gate { text-align: center; padding: 80px 20px; }
  #pin-gate input {
    font-size: 24px; text-align: center; letter-spacing: 8px; width: 220px;
    padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25);
    background: rgba(0,0,0,.35); color: #fff;
  }
  /* Field wrapper with save tick */
  .field-wrap { position: relative; display: flex; align-items: center; }
  .field-wrap input, .field-wrap textarea { flex: 1; }
  .save-tick {
    display: none; margin-left: 8px; flex-shrink: 0;
    width: 26px; height: 26px; line-height: 26px; text-align: center;
    background: #22c55e; color: #fff; border-radius: 50%;
    font-size: 15px; font-weight: bold;
  }
  .save-tick.show { display: inline-block; }
  /* Progress bars */
  .progress-wrap { display: none; margin-top: 10px; }
  .progress-track { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; border-radius: 4px; transition: width .2s; }
  #img-progress-bar { background: linear-gradient(90deg,#7c3aed,#a78bfa); }
  #sync-progress-bar { background: linear-gradient(90deg,#22c55e,#4ade80); }
  .progress-text { font-size: 12px; color: #94a3b8; margin-top: 4px; }
  /* Toast */
  #toast {
    display: none; position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1e293b; color: #fff; padding: 12px 24px; border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,.25); z-index: 9999; font-size: 14px; max-width: 90%;
  }
  #live-saved { color: #3fae6a; display: none; margin-left: 10px; font-size: 14px; }
</style>
</head>
<body>
<div id="admin">

  <!-- PIN gate -->
  <div id="pin-gate">
    <h2 style="margin-bottom:18px;">Admin Panel</h2>
    <p class="hint" style="margin-bottom:14px;">Enter PIN to continue</p>
    <input type="password" id="pin-input" maxlength="12" inputmode="numeric" placeholder="••••">
    <div><button class="btn primary" id="pin-go" style="margin-top:16px;">Unlock</button></div>
    <p class="hint" id="pin-err" style="color:#e05252; display:none;">Wrong PIN, try again.</p>
    <div style="margin-top:16px;"><a class="btn ghost" href="index.html">← Back to display</a></div>
  </div>

  <!-- Main panel -->
  <div id="admin-panel" style="display:none;">
    <h2 style="margin-bottom:6px;">Admin Panel</h2>
    <p class="hint">Changes save automatically.</p>

    <span id="live-saved">Synced ✓</span>
    <div id="sync-progress" class="progress-wrap">
      <div class="progress-track"><div id="sync-progress-bar" class="progress-fill"></div></div>
      <div id="sync-progress-text" class="progress-text">Syncing… 0%</div>
    </div>

    <div class="card" style="margin-top:16px;">
      <h3>Notices</h3>
      <div id="notice-list"></div>

      <h3 style="margin-top:18px;">Add notice</h3>
      <label>Title</label>
      <div class="field-wrap">
        <input type="text" id="new-title" placeholder="Notice title" autocomplete="off">
        <span class="save-tick" id="tick-new-title">✓</span>
      </div>
      <label>Details</label>
      <div class="field-wrap">
        <textarea id="new-body" placeholder="Notice details..."></textarea>
        <span class="save-tick" id="tick-new-body">✓</span>
      </div>
      <label>Photo (optional)</label>
      <div class="field-wrap">
        <input type="text" id="new-imgurl" placeholder="Paste an image link..." autocomplete="off">
        <span class="save-tick" id="tick-new-imgurl">✓</span>
      </div>
      <input type="file" id="new-imgfile" accept="image/*" style="margin-top:8px;">
      <div id="img-progress" class="progress-wrap">
        <div class="progress-track"><div id="img-progress-bar" class="progress-fill"></div></div>
        <div id="img-progress-text" class="progress-text">Uploading… 0%</div>
      </div>
      <img id="new-imgprev" alt="" style="display:none; max-width:180px; margin-top:10px; border-radius:8px;">
      <div><button class="btn primary" id="add-notice" style="margin-top:12px;">Add Notice</button></div>
    </div>

    <div class="card">
      <h3>Settings</h3>
      <label>Rotate every (seconds)</label>
      <div class="field-wrap">
        <input type="number" id="set-rot" min="4" max="120">
        <span class="save-tick" id="tick-set-rot">✓</span>
      </div>
      <p class="hint" style="margin-top:12px;">Admin PIN is managed securely on the server, not stored here.</p>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* ============================================================
   NOTICE BOARD ADMIN — clean rebuild
   - PIN verified server-side (/api/verify-pin), never in this page
   - Config synced via /api/sync (PIN stripped server-side too)
   - Two-click delete (no native confirm())
   - Real sync progress with server verification
   ============================================================ */
var LS_KEY = "noticeboard.v2"; /* v2: pin removed from stored config */

/* ---------- config ---------- */
function defaultConfig() {
  return {
    title: "Notice Board",
    bannerTitle: "Notice Board",
    logoUrl: "logo.png",
    theme: "dark",
    showQr: true,
    qrLabel: "Breaktime QR Code",
    qrUrl: "https://efftime.com/break_log/gate.php",
    showClocks: true,
    showDate: true,
    clock1Label: "INDIA",
    clock1Tz: "Asia/Kolkata",
    clock2Label: "UAE",
    clock2Tz: "Asia/Dubai",
    rotationSecs: 10,
    notices: []
  };
}
function loadConfig() {
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw) {
      var c = Object.assign(defaultConfig(), JSON.parse(raw));
      delete c.pin; /* never keep a PIN locally */
      return c;
    }
  } catch (e) {}
  return defaultConfig();
}
/* Returns true on success, false when storage is full/blocked */
function saveConfig(cfg) {
  try {
    var copy = JSON.parse(JSON.stringify(cfg));
    delete copy.pin;
    localStorage.setItem(LS_KEY, JSON.stringify(copy));
    return true;
  } catch (e) { return false; }
}
var CFG = loadConfig();

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* ---------- toast ---------- */
var toastTimer = null;
function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = "none"; }, 3500);
}

/* ---------- save ticks ---------- */
function showTick(fieldId) {
  var t = document.getElementById("tick-" + fieldId);
  if (t) t.classList.add("show");
}
function hideTick(fieldId) {
  var t = document.getElementById("tick-" + fieldId);
  if (t) t.classList.remove("show");
}

/* ---------- progress bars ---------- */
function setImgProgress(pct, text) {
  var wrap = document.getElementById("img-progress");
  var bar = document.getElementById("img-progress-bar");
  var txt = document.getElementById("img-progress-text");
  if (pct == null) { wrap.style.display = "none"; return; }
  wrap.style.display = "block";
  bar.style.width = Math.min(100, Math.max(0, pct)) + "%";
  txt.textContent = text || ("Uploading… " + Math.round(pct) + "%");
}
function setSyncProgress(pct, text) {
  var wrap = document.getElementById("sync-progress");
  var bar = document.getElementById("sync-progress-bar");
  var txt = document.getElementById("sync-progress-text");
  if (pct == null) { wrap.style.display = "none"; return; }
  wrap.style.display = "block";
  bar.style.width = Math.min(100, Math.max(0, pct)) + "%";
  txt.textContent = text || ("Syncing… " + Math.round(pct) + "%");
}

/* ---------- server sync ----------
   POSTs config to /api/sync. onOk fires only after the server
   confirms the GitHub commit (ok:true + sha in response). */
function syncToKiosk(onOk) {
  try {
    var copy = JSON.parse(JSON.stringify(CFG));
    delete copy.pin;
    var payload = JSON.stringify(copy);
    if (payload.length > 4 * 1024 * 1024) {
      showToast("Too large to sync — use a smaller photo.");
      var el2 = document.getElementById("live-saved");
      el2.style.display = ""; el2.textContent = "Sync failed — too large"; el2.style.color = "#e05252";
      setTimeout(function () { el2.style.display = "none"; el2.style.color = ""; }, 4000);
      setSyncProgress(null);
      return;
    }
    var xhr = new XMLHttpRequest();
    xhr.open("POST", "https://notice-board-sooty.vercel.app/api/sync", true);
    xhr.setRequestHeader("Content-Type", "application/json");
    setSyncProgress(0, "Starting sync…");
    xhr.upload.onprogress = function (e) {
      if (e.lengthComputable && e.total > 0) {
        var pct = Math.round((e.loaded / e.total) * 100);
        if (pct < 100) setSyncProgress(pct, "Uploading… " + pct + "%");
        else setSyncProgress(100, "Waiting for server…");
      }
    };
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      var el = document.getElementById("live-saved");
      if (xhr.status === 200) {
        var verified = false;
        try {
          var resp = JSON.parse(xhr.responseText);
          verified = resp && resp.ok === true && !!resp.sha;
        } catch (e) {}
        if (verified) {
          setSyncProgress(100, "Synced ✓");
          setTimeout(function () { setSyncProgress(null); }, 2000);
          el.style.display = ""; el.textContent = "Synced to display ✓"; el.style.color = "";
          if (onOk) onOk();
        } else {
          setSyncProgress(null);
          el.style.display = ""; el.textContent = "Sync unverified — check display"; el.style.color = "#e05252";
        }
      } else {
        setSyncProgress(null);
        el.style.display = ""; el.textContent = "Sync failed (" + xhr.status + ")"; el.style.color = "#e05252";
      }
      setTimeout(function () { el.style.display = "none"; el.style.color = ""; }, 4000);
    };
    xhr.onerror = function () {
      setSyncProgress(null);
      showToast("Sync failed — network error.");
    };
    xhr.send(payload);
  } catch (e) {
    setSyncProgress(null);
    showToast("Sync failed — please try again.");
  }
}

/* ---------- notice list ---------- */
function renderNoticeList() {
  var wrap = document.getElementById("notice-list");
  wrap.innerHTML = "";
  if (!CFG.notices.length) {
    wrap.innerHTML = '<p class="hint">No notices yet — add one below.</p>';
    return;
  }
  CFG.notices.forEach(function (n, i) {
    var d = document.createElement("div");
    d.className = "notice-item" + (n.active === false ? " inactive" : "");
    d.innerHTML =
      '<div class="ni-title">' + esc(n.title) + (n.active === false ? ' <span class="hint">(hidden)</span>' : "") + "</div>" +
      (n.img ? '<div class="hint">📷 photo attached</div>' : "") +
      '<div class="ni-body">' + esc(n.body) + "</div>" +
      '<button class="btn small ghost" data-a="toggle">' + (n.active === false ? "Show" : "Hide") + "</button>" +
      '<button class="btn small ghost" data-a="up">▲</button>' +
      '<button class="btn small ghost" data-a="down">▼</button>' +
      '<button class="btn small danger" data-a="del">Delete</button>';
    d.querySelectorAll("button").forEach(function (b) {
      b.onclick = function () { handleNoticeAction(b, n, i); };
    });
    wrap.appendChild(d);
  });
}

function handleNoticeAction(btn, n, i) {
  var a = btn.getAttribute("data-a");
  if (a === "del") {
    /* Two-click inline confirm — no native confirm() dialog */
    if (btn.getAttribute("data-armed") === "1") {
      doDeleteNotice(i);
    } else {
      btn.setAttribute("data-armed", "1");
      btn.textContent = "Sure?";
      btn.classList.add("armed");
      setTimeout(function () {
        btn.setAttribute("data-armed", "");
        btn.textContent = "Delete";
        btn.classList.remove("armed");
      }, 3000);
    }
    return;
  }
  if (a === "toggle") { n.active = (n.active === false); }
  else if (a === "up" && i > 0) { CFG.notices.splice(i - 1, 0, CFG.notices.splice(i, 1)[0]); }
  else if (a === "down" && i < CFG.notices.length - 1) { CFG.notices.splice(i + 1, 0, CFG.notices.splice(i, 1)[0]); }
  else { return; }
  persistAndSync();
  renderNoticeList();
}

function doDeleteNotice(idx) {
  var n = CFG.notices[idx];
  if (!n) return;
  var delTitle = n.title || "notice";
  CFG.notices.splice(idx, 1);
  if (!saveConfig(CFG)) {
    showToast("Could not save — storage issue. Please try again.");
    return;
  }
  renderNoticeList(); /* disappear immediately */
  showToast("Notice deleted: " + delTitle);
  syncToKiosk(); /* sync in background */
}

function persistAndSync(onOk) {
  if (!saveConfig(CFG)) {
    showToast("Could not save locally — storage full?");
    return;
  }
  syncToKiosk(onOk);
}

/* ---------- add notice ---------- */
var newImgData = "";

function setNewImgPreview(src) {
  var p = document.getElementById("new-imgprev");
  if (src) { p.src = src; p.style.display = ""; }
  else { p.src = ""; p.style.display = "none"; }
}

function initAddForm() {
  ["new-title", "new-body", "new-imgurl"].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener("input", function () { hideTick(id); });
  });

  document.getElementById("new-imgurl").addEventListener("input", function () {
    if (this.value.trim()) {
      document.getElementById("new-imgfile").value = "";
      newImgData = "";
      setNewImgPreview(this.value.trim());
    } else {
      setNewImgPreview("");
    }
  });

  /* Photo file → original quality data URL (no compression, per owner) */
  document.getElementById("new-imgfile").addEventListener("change", function () {
    var f = this.files && this.files[0];
    if (!f) return;
    document.getElementById("new-imgurl").value = "";
    hideTick("new-imgurl");
    var reader = new FileReader();
    setImgProgress(10, "Reading photo…");
    reader.onload = function () {
      setImgProgress(95, "Processing…");
      newImgData = reader.result; /* original quality */
      setImgProgress(null);
      setNewImgPreview(newImgData);
      var mb = newImgData.length / 1024 / 1024;
      if (mb > 1) showToast("Photo is large (" + (Math.round(mb * 10) / 10) + " MB) — may fail to sync.");
    };
    reader.onerror = function () {
      setImgProgress(null);
      showToast("Could not read photo — try another file.");
    };
    reader.readAsDataURL(f);
  });

  document.getElementById("add-notice").onclick = function () {
    var t = document.getElementById("new-title").value.trim();
    var b = document.getElementById("new-body").value.trim();
    if (!t) { showToast("Give the notice a title first."); return; }
    var img = newImgData || document.getElementById("new-imgurl").value.trim();
    CFG.notices.push({ id: "n" + Date.now(), title: t, body: b, img: img, active: true });
    document.getElementById("new-title").value = "";
    document.getElementById("new-body").value = "";
    document.getElementById("new-imgurl").value = "";
    document.getElementById("new-imgfile").value = "";
    newImgData = "";
    setNewImgPreview("");
    if (!saveConfig(CFG)) {
      CFG.notices.pop();
      renderNoticeList();
      showToast("Could not save — storage full? Try a smaller photo.");
      return;
    }
    renderNoticeList();
    persistAndSync(function () {
      showToast("Notice added: " + t);
      showTick("new-title"); showTick("new-body"); showTick("new-imgurl");
    });
  };
}

/* ---------- settings ---------- */
function initSettings() {
  var rot = document.getElementById("set-rot");
  rot.value = CFG.rotationSecs || 10;
  rot.addEventListener("input", function () { hideTick("set-rot"); });
  rot.addEventListener("change", function () {
    var r = parseInt(rot.value, 10);
    CFG.rotationSecs = isNaN(r) ? 10 : Math.max(4, Math.min(120, r));
    persistAndSync(function () { showTick("set-rot"); });
  });
}

/* ---------- PIN gate (server-side) ---------- */
function initPinGate() {
  var gate = document.getElementById("pin-gate");
  var panel = document.getElementById("admin-panel");

  function unlock() {
    gate.style.display = "none";
    panel.style.display = "";
    document.getElementById("set-rot").value = CFG.rotationSecs || 10;
    renderNoticeList();
  }

  /* Skip PIN if already unlocked this tab session */
  try {
    if (sessionStorage.getItem("nb_unlocked") === "1") { unlock(); return; }
  } catch (e) {}

  function go() {
    var v = document.getElementById("pin-input").value;
    if (!v) return;
    var btn = document.getElementById("pin-go");
    btn.textContent = "Checking…";
    btn.disabled = true;
    var xhr = new XMLHttpRequest();
    xhr.open("POST", "https://notice-board-sooty.vercel.app/api/verify-pin", true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      btn.textContent = "Unlock";
      btn.disabled = false;
      var ok = false;
      if (xhr.status === 200) {
        try { ok = JSON.parse(xhr.responseText).ok === true; } catch (e) {}
      }
      if (ok) {
        try { sessionStorage.setItem("nb_unlocked", "1"); } catch (e) {}
        document.getElementById("pin-err").style.display = "none";
        unlock();
      } else {
        document.getElementById("pin-err").style.display = "";
      }
    };
    xhr.onerror = function () {
      btn.textContent = "Unlock";
      btn.disabled = false;
      document.getElementById("pin-err").textContent = "Server unreachable — try again.";
      document.getElementById("pin-err").style.display = "";
    };
    xhr.send(JSON.stringify({ pin: v }));
  }

  document.getElementById("pin-go").onclick = go;
  document.getElementById("pin-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") go();
  });
}

/* ---------- boot ---------- */
initPinGate();
initAddForm();
initSettings();
</script>
</body>
</html>
