<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notice Board — Admin</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: radial-gradient(1200px 800px at 70% 20%, #24334f 0%, #141c2e 55%, #0d1322 100%);
    color: #fff;
    overflow-x: hidden;
    overflow-y: auto;
    min-height: 100%;
  }

  /* ---------- ADMIN VIEW ---------- */
  #admin { max-width: 920px; margin: 0 auto; padding: 30px 22px 60px; }
  .card {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px; padding: 22px; margin-bottom: 20px;
  }
  .card h3 { margin-bottom: 14px; font-size: 20px; }
  .card label { display: block; font-size: 13px; opacity: .75; margin: 12px 0 5px; }
  .card input[type=text], .card input[type=number], .card textarea, .card select {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.2);
    background: rgba(0,0,0,.3); color: #fff; font-size: 15px; font-family: inherit;
  }
  .card textarea { min-height: 80px; resize: vertical; }
  .row { display: flex; gap: 12px; } .row > * { flex: 1; }
  .btn {
    display: inline-block; padding: 10px 20px; border-radius: 8px; border: none;
    font-size: 15px; font-weight: 600; cursor: pointer; margin: 6px 6px 0 0;
  }
  .btn.primary { background: #2f7fe0; color: #fff; }
  .btn.ghost { background: rgba(255,255,255,.12); color: #fff; }
  .btn.danger { background: #e05252; color: #fff; }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  .notice-item {
    background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
  }
  .notice-item .ni-title { font-weight: 700; font-size: 16px; }
  .notice-item .ni-body { opacity: .8; font-size: 14px; margin: 4px 0 8px; white-space: pre-line; }
  .notice-item.inactive { opacity: .45; }
  .pill { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    padding: 3px 10px; border-radius: 999px; margin-left: 8px; vertical-align: middle; }
  #pin-gate { text-align: center; padding: 80px 20px; }
  #pin-gate input { font-size: 24px; text-align: center; letter-spacing: 8px; width: 200px;
    padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25);
    background: rgba(0,0,0,.35); color: #fff; }
  #kiosk-link-out { word-break: break-all; background: rgba(0,0,0,.35); padding: 12px;
    border-radius: 8px; font-size: 13px; margin-top: 10px; }
  .hint { font-size: 13px; opacity: .65; margin-top: 8px; line-height: 1.5; }
</style>
</head>
<body>
<!-- ================= ADMIN VIEW ================= -->
<div id="admin">
  <div id="pin-gate">
    <h2 style="margin-bottom:18px;">Admin Panel</h2>
    <p class="hint" style="margin-bottom:14px;">Enter PIN to continue</p>
    <input type="password" id="pin-input" maxlength="12" inputmode="numeric" placeholder="••••">
    <div><button class="btn primary" id="pin-go" style="margin-top:16px;">Unlock</button></div>
    <p class="hint" id="pin-err" style="color:#e05252; display:none;">Wrong PIN, try again.</p>
    <p class="hint">Default PIN is <b>1234</b> — change it below after unlocking.</p>
    <div><a class="btn ghost" href="index.html">← Back to display</a></div>
  </div>

  <div id="admin-panel" style="display:none;">
    <h2 style="margin-bottom:6px;">Admin Panel</h2>

    <div class="card">
      <h3>Notices</h3>
      <div id="notice-list"></div>
      <h3 style="margin-top:18px;">Add notice</h3>
      <label>Title</label><input type="text" id="new-title" placeholder="Notice title">
      <label>Details</label><textarea id="new-body" placeholder="Notice details..."></textarea>
      <label>Photo (optional)</label>
      <input type="text" id="new-imgurl" placeholder="Paste an image link...">
      <input type="file" id="new-imgfile" accept="image/*" style="margin-top:8px;">
      <img id="new-imgprev" alt="" style="display:none; max-width:180px; margin-top:10px; border-radius:8px;">
      <div class="row">
        <div><label>Tag</label>
          <select id="new-tag">
            <option value="info">Info</option>
            <option value="important">Important</option>
            <option value="urgent">Urgent</option>
            <option value="event">Event</option>
          </select>
        </div>
        <div><label>&nbsp;</label><button class="btn primary" id="add-notice">Add</button></div>
      </div>
    </div>

    <span id="live-saved" style="color:#3fae6a; display:none; margin-left:10px;">Synced ✓</span>
    <p class="hint">Changes save automatically.</p>

    <div class="card" style="margin-top:24px;">
      <h3>Settings</h3>
      <div class="row">
        <div><label>Rotate every (seconds)</label><input type="number" id="set-rot" min="4" max="120"></div>
        <div><label>Admin PIN</label><input type="text" id="set-pin" maxlength="12"></div>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============ storage & config ============ */
var LS_KEY = "noticeboard.v1";
var DEFAULT_QR = "https://efftime.com/break_log/gate.php";

/* ============ Firebase live sync (optional) ============
   Same config as the display page. When filled in, every save here
   pushes to the cloud and the kiosk screen updates instantly —
   no refresh, no new kiosk link. Photos upload to Firebase Storage;
   replacing/removing a photo deletes the old file (no orphans). */
var FIREBASE_CONFIG = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE_PROJECT_ID.firebaseapp.com",
  databaseURL: "https://PASTE_PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "PASTE_PROJECT_ID",
  storageBucket: "PASTE_PROJECT_ID.appspot.com",
  appId: "PASTE_APP_ID"
};
function firebaseReady() {
  return FIREBASE_CONFIG.apiKey.indexOf("PASTE") !== 0 && typeof firebase !== "undefined";
}
function fbApp() {
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  return firebase.app();
}
/* Push current config to the live database (no-op until configured). */
function pushLive() {
  if (!firebaseReady()) return;
  try {
    fbApp().database().ref("noticeboard/config").set(JSON.parse(JSON.stringify(CFG)));
    var el = document.getElementById("live-saved");
    if (el) { el.style.display = ""; setTimeout(function () { el.style.display = "none"; }, 2500); }
  } catch (e) {}
}
function uploadPhotoFile(file, cb) {
  try {
    var safe = (file.name || "photo").replace(/[^a-zA-Z0-9.\-_]/g, "_");
    var path = "noticeboard/photos/" + Date.now() + "_" + safe;
    var ref = fbApp().storage().ref(path);
    ref.put(file).then(function () { return ref.getDownloadURL(); })
      .then(function (url) { cb(url, path); })
      .catch(function () { alert("Photo upload failed. Try an image link instead."); });
  } catch (e) { alert("Photo upload failed. Try an image link instead."); }
}
/* Always delete the old photo when replaced or removed — no orphans. */
function deletePhotoPath(path) {
  if (!path || !firebaseReady()) return;
  try { fbApp().storage().ref(path).delete().catch(function () {}); } catch (e) {}
}

function defaultConfig() {
  return {
    pin: "1234",
    title: "Notice Board",
    bannerTitle: "Notice Board",
    logoUrl: "logo.png",
    showClocks: true,
    clock1Label: "INDIA",
    clock1Tz: "Asia/Kolkata",
    clock2Label: "UAE",
    clock2Tz: "Asia/Dubai",
    showDate: true,
    showQr: true,
    qrLabel: "Breaktime QR Code",
    qrUrl: "https://efftime.com/break_log/gate.php",
    theme: "light",
    rotationSecs: 10,
    notices: [
      { id: "n1", title: "Welcome to the Notice Board", body: "This is a sample notice.\nReplace it on the admin page (PIN 1234).", tag: "info", active: true },
      { id: "n2", title: "Sample: Team meeting at 4 PM", body: "Conference room. This is a sample — delete it on the admin page.", tag: "event", active: true }
    ]
  };
}
function b64e(s) {
  return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64d(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  return decodeURIComponent(escape(atob(s)));
}
function loadConfig() {
  var h = location.hash || "";
  if (h.indexOf("#c=") === 0) {
    try { return Object.assign(defaultConfig(), JSON.parse(b64d(h.slice(3)))); } catch (e) {}
  }
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw) return Object.assign(defaultConfig(), JSON.parse(raw));
  } catch (e) {}
  return defaultConfig();
}
function saveConfig(cfg) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(cfg)); } catch (e) {}
}
var CFG = loadConfig();
function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* ============ admin view ============ */
function displayURL() {
  var base = location.href.split("#")[0];
  base = base.slice(0, base.lastIndexOf("/") + 1) + "index.html";
  return base + "#c=" + b64e(JSON.stringify(CFG));
}
function renderNoticeList() {
  var wrap = document.getElementById("notice-list");
  wrap.innerHTML = "";
  CFG.notices.forEach(function (n, i) {
    var d = document.createElement("div");
    d.className = "notice-item" + (n.active ? "" : " inactive");
    d.innerHTML =
      (n.img ? '<img src="' + esc(n.img) + '" alt="" style="max-width:120px;border-radius:8px;margin-bottom:8px;display:block;">' : "") +
      '<span class="ni-title">' + esc(n.title) + '</span><span class="pill tag ' + esc(n.tag || "info") + '">' + esc(n.tag || "info") + "</span>" +
      '<div class="ni-body">' + esc(n.body) + "</div>" +
      '<button class="btn small ghost" data-a="toggle">' + (n.active ? "Hide" : "Show") + "</button>" +
      '<button class="btn small ghost" data-a="edit">Edit</button>' +
      '<button class="btn small ghost" data-a="up">▲</button>' +
      '<button class="btn small ghost" data-a="down">▼</button>' +
      '<button class="btn small danger" data-a="del">Delete</button>';
    d.querySelectorAll("button").forEach(function (b) {
      b.onclick = function () {
        var a = b.getAttribute("data-a");
        if (a === "del") { if (confirm("Delete this notice?")) { deletePhotoPath(CFG.notices[i].imgPath); CFG.notices.splice(i, 1); } }
        else if (a === "toggle") { n.active = !n.active; }
        else if (a === "up" && i > 0) { CFG.notices.splice(i - 1, 0, CFG.notices.splice(i, 1)[0]); }
        else if (a === "down" && i < CFG.notices.length - 1) { CFG.notices.splice(i + 1, 0, CFG.notices.splice(i, 1)[0]); }
        else if (a === "edit") {
          var t = prompt("Title:", n.title); if (t === null) return;
          var bo = prompt("Details:", n.body); if (bo === null) return;
          var tg = prompt("Tag (info / important / urgent / event):", n.tag || "info");
          n.title = t; n.body = bo;
          if (["info", "important", "urgent", "event"].indexOf((tg || "").toLowerCase()) >= 0) n.tag = tg.toLowerCase();
          var im = prompt("Photo: paste an image URL, type 'none' to remove, or leave empty to keep the current photo.", "");
          if (im !== null) {
            im = im.trim();
            if (im.toLowerCase() === "none") { deletePhotoPath(n.imgPath); n.img = ""; n.imgPath = ""; }
            else if (im) { deletePhotoPath(n.imgPath); n.img = im; n.imgPath = ""; }
          }
        }
        saveConfig(CFG); pushLive(); syncToKiosk(); renderNoticeList();
      };
    });
    wrap.appendChild(d);
  });
  if (!CFG.notices.length) wrap.innerHTML = '<p class="hint">No notices yet — add one below.</p>';
}
function initAdmin() {
  var unlock = function () {
    document.getElementById("pin-gate").style.display = "none";
    document.getElementById("admin-panel").style.display = "";
    document.getElementById("set-rot").value = CFG.rotationSecs || 10;
    document.getElementById("set-pin").value = CFG.pin || "";
    renderNoticeList();
  };
  /* Skip PIN if already unlocked this session */
  try {
    if (sessionStorage.getItem("nb_unlocked") === "1") { unlock(); }
  } catch (e) {}
  var go = function () {
    var v = document.getElementById("pin-input").value;
    if (v === CFG.pin) {
      try { sessionStorage.setItem("nb_unlocked", "1"); } catch (e) {}
      unlock();
    } else {
      document.getElementById("pin-err").style.display = "";
    }
  };
  document.getElementById("pin-go").onclick = go;
  document.getElementById("pin-input").addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });

  var newImgData = "";
  var newImgPath = "";
  function setNewImgPreview(src) {
    var p = document.getElementById("new-imgprev");
    if (src) { p.src = src; p.style.display = ""; } else { p.style.display = "none"; }
  }
  document.getElementById("new-imgurl").addEventListener("input", function () {
    newImgData = ""; newImgPath = "";
    setNewImgPreview(this.value.trim());
  });
  document.getElementById("new-imgfile").addEventListener("change", function () {
    var f = this.files && this.files[0];
    if (!f) return;
    document.getElementById("new-imgurl").value = "";
    if (firebaseReady()) {
      setNewImgPreview("");
      uploadPhotoFile(f, function (url, path) { newImgData = url; newImgPath = path; setNewImgPreview(url); });
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var maxW = 900, w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        var c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        newImgData = c.toDataURL("image/jpeg", 0.72);
        setNewImgPreview(newImgData);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
  });

  document.getElementById("add-notice").onclick = function () {
    var t = document.getElementById("new-title").value.trim(),
        b = document.getElementById("new-body").value.trim();
    if (!t) { alert("Give the notice a title."); return; }
    var img = newImgData || document.getElementById("new-imgurl").value.trim();
    CFG.notices.push({ id: "n" + Date.now(), title: t, body: b, tag: document.getElementById("new-tag").value, img: img, imgPath: newImgPath, active: true });
    document.getElementById("new-title").value = "";
    document.getElementById("new-body").value = "";
    document.getElementById("new-imgurl").value = "";
    document.getElementById("new-imgfile").value = "";
    newImgData = ""; newImgPath = ""; setNewImgPreview("");
    saveConfig(CFG); pushLive(); syncToKiosk(); renderNoticeList();
  };

  function collect() {
    CFG.title = "Notice Board";
    var r = parseInt(document.getElementById("set-rot").value, 10);
    CFG.rotationSecs = isNaN(r) ? 10 : Math.max(4, Math.min(120, r));
    var p = document.getElementById("set-pin").value.trim();
    if (p) CFG.pin = p;
  }
  /* Auto-sync on any setting change — no Save button needed */
  function autoSync() { collect(); saveConfig(CFG); pushLive(); syncToKiosk(); }
  ["set-rot","set-pin"].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener("change", autoSync);
  });
  /* Push config to the shared kiosk via the sync API (no token in the page) */
  function syncToKiosk() {
    try {
      var xhr = new XMLHttpRequest();
      xhr.open("POST", "/api/sync", true);
      xhr.setRequestHeader("Content-Type", "application/json");
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        var el = document.getElementById("live-saved");
        if (xhr.status === 200) { el.style.display = ""; el.textContent = "Synced to display ✓"; }
        else { el.style.display = ""; el.textContent = "Sync failed — display will use last saved"; el.style.color = "#d33"; }
        setTimeout(function () { el.style.display = "none"; el.style.color = ""; }, 4000);
      };
      xhr.send(JSON.stringify(CFG));
    } catch (e) {}
  }
}

/* ============ boot ============ */
initAdmin();
</script>
</body>
</html>
