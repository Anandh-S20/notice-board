<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notice Board</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", system-ui, Arial, sans-serif;
    background:
      radial-gradient(800px 600px at 15% 20%, rgba(167,139,250,.15) 0%, transparent 60%),
      radial-gradient(700px 500px at 85% 30%, rgba(244,114,182,.12) 0%, transparent 60%),
      radial-gradient(900px 700px at 50% 90%, rgba(96,165,250,.12) 0%, transparent 60%),
      linear-gradient(135deg, #fafafa 0%, #f0f4f8 100%);
    color: #1e293b;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- DISPLAY VIEW ---------- */
  #display { height: 100vh; display: flex; flex-direction: column; }
  #display header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0; margin: 20px 44px 14px; border-radius: 20px;
    background: linear-gradient(120deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,.6) 100%);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px rgba(0,0,0,.06), inset 0 1px 0 rgba(255,255,255,.9);
    padding: 22px 42px;
    position: relative; overflow: hidden;
    border: 1px solid rgba(255,255,255,.8);
  }
  #display header::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
    background: linear-gradient(180deg, #a78bfa, #f472b6, #fb923c);
    border-radius: 20px 0 0 20px;
  }
  #display header::after {
    content: ""; position: absolute; right: -40px; top: -40px;
    width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle, rgba(167,139,250,.08) 0%, rgba(167,139,250,0) 70%);
    pointer-events: none;
  }
  #board-title { font-size: clamp(28px, 3.2vw, 44px); font-weight: 800; letter-spacing: 3px; text-transform: uppercase; background: linear-gradient(120deg, #4c1d95, #7c3aed, #db2777); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  #board-title::after {
    content: ""; display: block; width: 70px; height: 3px;
    background: linear-gradient(90deg, #a78bfa, #f472b6);
    margin-top: 8px; border-radius: 3px;
  }
  #clock-in { color: #4c1d95; text-align: right; margin-left: 0; }
  #clock-in .time, #clock-uae .time { font-size: clamp(20px, 2.2vw, 30px); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.25; color: #2d3748; }
  #clock-in .tz, #clock-uae .tz { font-size: clamp(12px, 1.3vw, 16px); font-weight: 700; opacity: .7; letter-spacing: 2px; margin-right: 10px; color: #a78bfa; text-transform: uppercase; }
  #clock-in, #clock-uae { display: block; }
  #clock-uae { color: #4c1d95; text-align: right; flex: none; }
  @keyframes flagfloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  #clock-uae { flex: 1; text-align: center; color: #fff; }
  #clock .date, .date { font-size: clamp(14px, 1.4vw, 20px); opacity: .6; margin-top: 6px; color: #718096; font-weight: 500; letter-spacing: 1px; }

  #display main {
    flex: 1; display: flex; gap: 26px;
    padding: 14px 42px 34px; min-height: 0; align-items: stretch;
  }
  #qr-panel { width: 400px; flex-shrink: 0; align-self: stretch; }
  #notice-area { flex: 1; display: flex; min-width: 0; min-height: 0; position: relative; perspective: 1200px; }
  .notice-card {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center;
    background: linear-gradient(135deg, rgba(255,255,255,.75) 0%, rgba(255,255,255,.55) 100%);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255,255,255,.8);
    box-shadow: 0 8px 32px rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.9);
    border-radius: 24px;
    padding: clamp(32px, 4.5vw, 68px);
    display: flex; flex-direction: column; justify-content: center;
    opacity: 0; transform: rotateY(90deg) translateZ(100px);
    transition: opacity .7s ease, transform .7s cubic-bezier(.2,.8,.3,1.1);
    pointer-events: none;
    color: #1e293b;
    backface-visibility: hidden;
    transform-style: preserve-3d;
    position: absolute;
  }
  .notice-card.show { opacity: 1; transform: rotateY(0deg) translateZ(0); pointer-events: auto; }
  .notice-card.show:hover { transform: rotateY(0deg) translateZ(20px) scale(1.01); }
  .notice-card h2 {
    font-size: clamp(28px, 3.2vw, 52px); font-weight: 800; margin: 0 0 18px;
    color: #1e293b; letter-spacing: .5px; line-height: 1.2;
  }
  .notice-card p {
    font-size: clamp(18px, 2vw, 28px); line-height: 1.6; color: #475569;
    margin: 0; white-space: pre-line;
  }
  .notice-card .tag {
    align-self: flex-start; font-size: clamp(12px, 1.1vw, 15px); font-weight: 700;
    text-transform: uppercase; letter-spacing: 2px; color: #fff;
    padding: 8px 20px; border-radius: 4px; margin-bottom: 22px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .tag.info     { background: linear-gradient(135deg, #1e3a5f, #0f1e3d); }
  .tag.important{ background: linear-gradient(135deg, #c9a227, #a8861c); }
  .tag.urgent   { background: linear-gradient(135deg, #b91c1c, #7f1d1d); }
  .tag.event    { background: linear-gradient(135deg, #0d5c63, #083f45); }
  /* photo notice: image fills the entire event box.
     Text sits at the top, below the banner. */
  .notice-card.has-img {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch;
    padding: 0; margin: 0;
    border: 0; border-radius: 22px; overflow: hidden;
    background: #1a2332;
  }
  .notice-card.has-img .photo-fill {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center; z-index: 0;
  }
  .photo-overlay {
    position: relative; z-index: 1;
    background: linear-gradient(to bottom, rgba(5,8,20,.92) 0%, rgba(5,8,20,.55) 55%, transparent 100%);
    padding: 36px clamp(28px, 4vw, 60px) 70px; border-radius: 0;
  }
  .photo-overlay {
    position: relative; z-index: 1;
    background: linear-gradient(to bottom, rgba(5,8,20,.92) 0%, rgba(5,8,20,.55) 55%, transparent 100%);
    padding: 36px clamp(28px, 4vw, 60px) 70px; border-radius: 0;
  }
  .notice-text { min-width: 0; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }

  #qr-panel {
    width: clamp(320px, 26vw, 400px);
    background: linear-gradient(165deg, rgba(255,255,255,.9) 0%, rgba(255,255,255,.7) 100%);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: #2d3748;
    padding: 32px 28px; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;
    box-shadow: 0 8px 32px rgba(0,0,0,.06), inset 0 1px 0 rgba(255,255,255,.9);
    flex-shrink: 0; border-radius: 20px;
    border: 1px solid rgba(255,255,255,.8);
    align-self: stretch;
    position: relative; overflow: hidden;
  }
  #qr-panel::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 5px;
    background: linear-gradient(90deg, #a78bfa, #f472b6, #fb923c);
  }
  #qr-label { font-size: clamp(14px, 1.4vw, 18px); font-weight: 700; text-align: center; color: #fff; background: linear-gradient(120deg, #8b5cf6, #d946ef); border-radius: 999px; padding: 10px 28px; margin-bottom: 20px; letter-spacing: 1.5px; box-shadow: 0 4px 16px rgba(139,92,246,.3); text-transform: uppercase; }
  /* Breaktime QR crop: their live page loads in the iframe behind, and this
     window cuts out ONLY the QR code (their QR is a fixed 500x500 image at
     page x=0, y~158 in a 500x875 iframe). JS scales it to fit exactly. */
  #qr-crop {
    width: 100%; aspect-ratio: 1 / 1; overflow: hidden; position: relative;
    background: #fff; border-radius: 14px;
  }
  #qr-frame {
    width: 500px; height: 875px; border: 0; display: block;
    position: absolute; left: 0; top: 0;
    transform-origin: 0 0;
  }

  /* no notices: QR stays left permanently, no rotation */
  #display main.no-notices { grid-template-columns: 1fr; }
  #display main.no-notices #notice-area { display: none; }
  #display main.no-notices #qr-panel { grid-column: 1; justify-self: start; width: clamp(320px, 26vw, 400px); }

  @media (max-width: 1100px) {
    #display main { grid-template-columns: 1fr; overflow-y: auto; }
    #display main.no-notices { grid-template-columns: 1fr; }
    #qr-panel, #notice-area { grid-column: 1; }
    #qr-panel { order: -1; justify-self: center; }
    #notice-area { min-height: 420px; }
  }

  /* ---------- DARK THEME ---------- */
  body[data-theme="dark"] {
    background: radial-gradient(1200px 800px at 70% 20%, #2a1f3d 0%, #16121f 55%, #0d0a14 100%);
    color: #fff;
  }
  body[data-theme="dark"] #display header {
    background: linear-gradient(100deg, #b91c1c 0%, #7c3aed 50%, #2563eb 100%);
    box-shadow: 0 10px 34px rgba(124, 58, 237, .35);
  }
  body[data-theme="dark"] #board-title { color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.35); }
  body[data-theme="dark"] #clock-in, body[data-theme="dark"] #clock-uae { color: #fff; }
  body[data-theme="dark"] #clock-in .tz, body[data-theme="dark"] #clock-uae .tz { color: #fff; opacity: .85; }
  body[data-theme="dark"] .date { color: #fff; }
  body[data-theme="dark"] .notice-card {
    background: linear-gradient(135deg, rgba(76,29,149,.85) 0%, rgba(30,27,75,.9) 50%, rgba(15,23,42,.92) 100%);
    border-color: rgba(167,139,250,.35); color: #fff;
  }
  body[data-theme="dark"] .notice-card h2 {
    background: linear-gradient(90deg, #fff 30%, #c4b5fd 70%, #fca5a5);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  body[data-theme="dark"] .notice-card p { color: #fff; opacity: .92; }

</style>
</head>
<body>
<!-- ================= DISPLAY VIEW ================= -->
<div id="display">
  <header>
    <div style="display:flex; align-items:center; gap:16px;">
      <img id="banner-logo" src="logo.png" alt="Logo" style="height:84px; width:auto; transition: transform .5s ease; transform-style: preserve-3d;" onmouseover="this.style.transform='rotateY(15deg) scale(1.05)'" onmouseout="this.style.transform=''">
      <div id="board-title">Notice Board</div>
    </div>
    <div style="display:flex; align-items:center; gap:36px;">
      <div class="date" id="head-date"></div>
      <div id="clocks-col" style="display:flex; flex-direction:column; gap:6px; align-items:flex-end;">
        <div id="clock-in"><div class="time"><span class="tz">INDIA</span><span id="time-in">--</span></div></div>
        <div id="clock-uae"><div class="time"><span class="tz">UAE</span><span id="time-uae">--</span></div></div>
      </div>
    </div>
  </header>
  <main>
    <div id="qr-panel">
      <div id="qr-label">Breaktime QR Code</div>
      <div id="qr-crop">
        <iframe id="qr-frame" title="Breaktime QR" scrolling="no" sandbox="allow-scripts allow-same-origin"></iframe>
      </div>
    </div>
    <div id="notice-area">
      <div id="cards"></div>
    </div>
  </main>
</div>

<script>
"use strict";
/* ============ storage & config ============ */
var LS_KEY = "noticeboard.v1";
var DEFAULT_QR = "https://efftime.com/break_log/gate.php";

/* ============ Firebase live sync (optional) ============
   Fill in a free Firebase project's web config to make the display
   update instantly when the admin panel saves — no refresh, no new
   kiosk link. Until configured, the page works exactly as before
   (localStorage + #c= kiosk link). */
var FIREBASE_CONFIG = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE_PROJECT_ID.firebaseapp.com",
  databaseURL: "https://PASTE_PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "PASTE_PROJECT_ID",
  storageBucket: "PASTE_PROJECT_ID.appspot.com",
  appId: "PASTE_APP_ID"
};
function firebaseReady() {
  return FIREBASE_CONFIG.apiKey.indexOf("PASTE") !== 0 && typeof firebase !== "undefined";
}

function defaultConfig() {
  return {
    pin: "1234",
    title: "Notice Board",
    bannerTitle: "Notice Board",
    logoUrl: "logo.png",
    showClocks: true,
    clock1Label: "INDIA",
    clock1Tz: "Asia/Kolkata",
    clock2Label: "UAE",
    clock2Tz: "Asia/Dubai",
    showDate: true,
    showQr: true,
    qrLabel: "Breaktime QR Code",
    qrUrl: "https://efftime.com/break_log/gate.php",
    theme: "light",
    rotationSecs: 10,
    notices: [
      { id: "n1", title: "Welcome to the Notice Board", body: "This is a sample notice.\nReplace it on the admin page (PIN 1234).", tag: "info", active: true },
      { id: "n2", title: "Sample: Team meeting at 4 PM", body: "Conference room. This is a sample — delete it on the admin page.", tag: "event", active: true }
    ]
  };
}
function b64e(s) {
  return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64d(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  return decodeURIComponent(escape(atob(s)));
}
function loadConfig() {
  var h = location.hash || "";
  if (h.indexOf("#c=") === 0) {
    try { return Object.assign(defaultConfig(), JSON.parse(b64d(h.slice(3)))); } catch (e) {}
  }
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw) return Object.assign(defaultConfig(), JSON.parse(raw));
  } catch (e) {}
  return defaultConfig();
}
/* Fetch the shared kiosk config from the repo (no auth needed, public).
   This makes the plain link work as a kiosk — no long hash required. */
function fetchKioskConfig(cb) {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "https://raw.githubusercontent.com/Anandh-S20/notice-board/main/config.json?_=" + Date.now(), true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status === 200) {
        try {
          var remote = JSON.parse(xhr.responseText);
          /* Use the shared config if valid (even with zero notices = clean board) */
          if (remote && typeof remote === "object" && Array.isArray(remote.notices)) {
            CFG = Object.assign(defaultConfig(), remote);
            try { localStorage.setItem(LS_KEY, JSON.stringify(CFG)); } catch (e) {}
          }
        } catch (e) {}
      }
      cb();
    };
    xhr.onerror = function () { cb(); };
    xhr.send();
  } catch (e) { cb(); }
}
function saveConfig(cfg) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(cfg)); } catch (e) {}
}
var CFG = loadConfig();
function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* ============ display view ============ */
var curIdx = 0, rotTimer = null;

function activeNotices() { return CFG.notices.filter(function (n) { return n.active; }); }

var qrReloadTimer = null;
/* The breaktime panel keeps their live page loading behind and crops the
   view to ONLY the QR code (big and clean, like a standalone QR image).
   Their page refreshes its own code every ~9.5 minutes; the frame also
   reloads on a 10-minute safety cycle. */
function fitQrCrop() {
  var win = document.getElementById("qr-crop");
  var frame = document.getElementById("qr-frame");
  if (!win || !frame || !win.clientWidth) return;
  var s = win.clientWidth / 500;
  frame.style.transform = "scale(" + s + ")";
  /* Their QR starts ~160px down their page; scale the offset with the
     zoom so the crop always lands on the QR, never the timer below. */
  frame.style.top = (-160 * s) + "px";
}
function renderQR() {
  var frame = document.getElementById("qr-frame");
  document.getElementById("qr-label").textContent = "Breaktime QR Code";
  var pageUrl = CFG.qrUrl || DEFAULT_QR;
  if (frame.getAttribute("src") !== pageUrl) frame.setAttribute("src", pageUrl);
  fitQrCrop();
  if (qrReloadTimer) clearInterval(qrReloadTimer);
  qrReloadTimer = setInterval(function () { frame.setAttribute("src", pageUrl); }, 10 * 60 * 1000);
}

function renderNotices() {
  var list = activeNotices(), wrap = document.getElementById("cards");
  var mainEl = document.querySelector("#display main");
  wrap.innerHTML = "";
  if (!list.length) {
    // No notices: show only the centered QR, no rotation timer.
    mainEl.classList.add("no-notices");
    if (rotTimer) { clearTimeout(rotTimer); rotTimer = null; }
    return;
  }
  mainEl.classList.remove("no-notices");
  if (curIdx >= list.length) curIdx = 0;
  list.forEach(function (n, i) {
    var d = document.createElement("div");
    d.className = "notice-card" + (i === curIdx ? " show" : "") + (n.img ? " has-img" : "");
    if (n.img) {
      d.innerHTML = '<img class="photo-fill" src=' + JSON.stringify(n.img) + ' alt="">' +
        '<div class="photo-overlay"><span class="tag ' + esc(n.tag || "info") + '">' + esc(n.tag || "info") + "</span>" +
        "<h2>" + esc(n.title) + "</h2><p>" + esc(n.body) + "</p></div>";
    } else {
      d.innerHTML = '<div class="notice-text"><span class="tag ' + esc(n.tag || "info") + '">' + esc(n.tag || "info") + "</span>" +
        "<h2>" + esc(n.title) + "</h2><p>" + esc(n.body) + "</p></div>";
    }
    wrap.appendChild(d);
  });
}

function showNotice(i) {
  var list = activeNotices();
  if (!list.length) return;
  curIdx = (i + list.length) % list.length;
  renderNotices();
  restartRotation();
}
function restartRotation() {
  if (rotTimer) clearTimeout(rotTimer);
  rotTimer = null;
  if (!activeNotices().length) return; // nothing to rotate: stay on the centered QR
  var secs = Math.max(4, Math.min(120, CFG.rotationSecs || 10));
  rotTimer = setTimeout(function () { showNotice(curIdx + 1); }, secs * 1000);
}
function tickClock() {
  var d = new Date(), dt = document.getElementById("head-date");
  var fmt = { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true };
  var tz1 = CFG.clock1Tz || "Asia/Kolkata", tz2 = CFG.clock2Tz || "Asia/Dubai";
  document.getElementById("time-in").textContent =
    d.toLocaleTimeString("en-IN", Object.assign({ timeZone: tz1 }, fmt));
  document.getElementById("time-uae").textContent =
    d.toLocaleTimeString("en-IN", Object.assign({ timeZone: tz2 }, fmt));
  dt.textContent = d.toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: tz1 });
}
function applyConfigToDisplay() {
  /* Banner */
  document.getElementById("board-title").textContent = CFG.bannerTitle || "Notice Board";
  var logoImg = document.getElementById("banner-logo");
  if (CFG.logoUrl === "__none__") { logoImg.style.display = "none"; }
  else { logoImg.style.display = ""; logoImg.src = CFG.logoUrl || "logo.png"; }
  /* Clocks */
  var clocks = document.getElementById("clocks-col");
  if (CFG.showClocks === false) { clocks.style.display = "none"; }
  else {
    clocks.style.display = "";
    document.querySelector("#clock-in .tz").textContent = CFG.clock1Label || "INDIA";
    document.querySelector("#clock-uae .tz").textContent = CFG.clock2Label || "UAE";
  }
  /* Date */
  document.getElementById("head-date").style.display = CFG.showDate === false ? "none" : "";
  /* QR panel */
  var qr = document.getElementById("qr-panel");
  if (CFG.showQr === false) { qr.style.display = "none"; }
  else {
    qr.style.display = "";
    document.getElementById("qr-label").textContent = CFG.qrLabel || "Breaktime QR Code";
  }
  /* Theme */
  document.body.setAttribute("data-theme", CFG.theme || "light");
  renderQR(); curIdx = 0; renderNotices(); restartRotation();
}
function initDisplay() {
  /* Try the shared kiosk config first, then render */
  fetchKioskConfig(function () {
    applyConfigToDisplay();
    tickClock();
    setInterval(tickClock, 1000);
    window.addEventListener("resize", fitQrCrop);
    initLiveSync();
    initConfigPoll();
  });
}
/* Smart poll: check the shared config every 30s, re-render notices only
   if something changed — no page reload, no QR flicker. */
function initConfigPoll() {
  setInterval(function () {
    try {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", "https://raw.githubusercontent.com/Anandh-S20/notice-board/main/config.json?_=" + Date.now(), true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4 || xhr.status !== 200) return;
        try {
          var remote = JSON.parse(xhr.responseText);
          if (!remote || typeof remote !== "object" || !Array.isArray(remote.notices)) return;
          var newStr = JSON.stringify(remote), curStr = JSON.stringify(CFG);
          if (newStr !== curStr) {
            CFG = Object.assign(defaultConfig(), remote);
            try { localStorage.setItem(LS_KEY, JSON.stringify(CFG)); } catch (e) {}
            applyConfigToDisplay();
          }
        } catch (e) {}
      };
      xhr.send();
    } catch (e) {}
  }, 10000);
}
/* Live updates from Firebase (if configured). A #c= kiosk link always wins. */
function initLiveSync() {
  if (!firebaseReady()) return;
  if ((location.hash || "").indexOf("#c=") === 0) return;
  try {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    firebase.database().ref("noticeboard/config").on("value", function (snap) {
      var val = snap.val();
      if (val && typeof val === "object") {
        CFG = Object.assign(defaultConfig(), val);
        saveConfig(CFG);
        applyConfigToDisplay();
      }
    });
  } catch (e) { /* stay in local mode */ }
}

/* ============ boot ============ */
initDisplay();
</script>
</body>
</html>
