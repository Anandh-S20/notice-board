<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notice Board</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: radial-gradient(1200px 800px at 70% 20%, #24334f 0%, #141c2e 55%, #0d1322 100%);
    color: #fff;
    overflow: hidden;
  }

  /* ---------- DISPLAY VIEW ---------- */
  #display { height: 100vh; display: flex; flex-direction: column; }
  #display header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 42px 6px;
  }
  #board-title { font-size: clamp(28px, 3.4vw, 44px); font-weight: 700; letter-spacing: 1px; }
  #clock { text-align: right; }
  #clock .time { font-size: clamp(26px, 3vw, 40px); font-weight: 600; font-variant-numeric: tabular-nums; }
  #clock .date { font-size: clamp(14px, 1.4vw, 20px); opacity: .7; }

  #display main {
    flex: 1; display: grid; grid-template-columns: auto minmax(0, 1fr);
    gap: 26px; padding: 14px 42px 34px; min-height: 0; align-items: stretch;
  }
  #qr-panel { grid-column: 1; }
  #notice-area { grid-column: 2; position: relative; min-width: 0; }
  .notice-card {
    position: absolute; inset: 0;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 22px;
    padding: clamp(28px, 4vw, 60px);
    display: flex; flex-direction: column; justify-content: center;
    opacity: 0; transform: translateY(14px);
    transition: opacity .6s ease, transform .6s ease;
    pointer-events: none;
  }
  .notice-card.show { opacity: 1; transform: none; pointer-events: auto; }
  .notice-card .tag {
    align-self: flex-start; font-size: clamp(13px, 1.2vw, 17px); font-weight: 700;
    text-transform: uppercase; letter-spacing: 2px;
    padding: 8px 18px; border-radius: 999px; margin-bottom: 22px;
  }
  .tag.info     { background: #2f7fe0; }
  .tag.important{ background: #e09a2f; }
  .tag.urgent   { background: #e05252; }
  .tag.event    { background: #3fae6a; }
  .notice-card h2 { font-size: clamp(30px, 4.2vw, 64px); margin-bottom: 18px; line-height: 1.15; }
  .notice-card p  { font-size: clamp(18px, 2.2vw, 32px); line-height: 1.55; opacity: .92; white-space: pre-line; }
  /* photo notice: the photo goes FULLSCREEN behind everything — the header
     (title/clock) and the breaktime QR panel float above it. Text stays
     overlaid at the bottom of the photo. */
  .notice-card.has-img {
    position: fixed; inset: 0; z-index: 1;
    background-size: cover; background-position: center; background-repeat: no-repeat;
    justify-content: flex-end; align-items: stretch; padding: 0;
    border: 0; border-radius: 0;
  }
  /* top scrim so the title/clock stay readable over bright photos */
  .notice-card.has-img::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 140px;
    background: linear-gradient(to bottom, rgba(5,8,20,.7), transparent);
    pointer-events: none;
  }
  #display header { position: relative; z-index: 2; }
  #qr-panel { position: relative; z-index: 2; }
  .photo-overlay {
    background: linear-gradient(to top, rgba(5,8,20,.92) 0%, rgba(5,8,20,.55) 55%, transparent 100%);
    padding: 70px clamp(28px, 4vw, 60px); border-radius: 0;
  }
  .notice-text { min-width: 0; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }

  #qr-panel {
    align-self: center;
    width: clamp(300px, 24vw, 360px);
    background: #fff; color: #141414; border-radius: 22px;
    padding: 30px 26px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  #qr-label { font-size: clamp(16px, 1.6vw, 22px); font-weight: 600; margin-bottom: 18px; text-align: center; }
  /* Live website embedded in the QR panel (replaces the static QR image). */
  #qr-frame { width: 100%; height: clamp(560px, 70vh, 660px); border: 0; border-radius: 14px; background: #fff; }

  /* no notices: QR stays left permanently, no rotation */
  #display main.no-notices { grid-template-columns: 1fr; }
  #display main.no-notices #notice-area { display: none; }
  #display main.no-notices #qr-panel { grid-column: 1; justify-self: start; width: clamp(320px, 26vw, 400px); }

  @media (max-width: 1100px) {
    #display main { grid-template-columns: 1fr; overflow-y: auto; }
    #display main.no-notices { grid-template-columns: 1fr; }
    #qr-panel, #notice-area { grid-column: 1; }
    #qr-panel { order: -1; justify-self: center; }
    #notice-area { min-height: 420px; }
  }


</style>
</head>
<body>
<!-- ================= DISPLAY VIEW ================= -->
<div id="display">
  <header>
    <div id="board-title">Notice Board</div>
    <div id="clock"><div class="time">--:--:--</div><div class="date"></div></div>
  </header>
  <main>
    <div id="notice-area">
      <div id="cards"></div>
    </div>
    <div id="qr-panel">
      <div id="qr-label">Breaktime QR Code</div>
      <iframe id="qr-frame" title="Breaktime QR" scrolling="no" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
  </main>
</div>

<script>
"use strict";
/* ============ storage & config ============ */
var LS_KEY = "noticeboard.v1";
var DEFAULT_QR = "https://efftime.com/break_log/gate.php";

/* ============ Firebase live sync (optional) ============
   Fill in a free Firebase project's web config to make the display
   update instantly when the admin panel saves — no refresh, no new
   kiosk link. Until configured, the page works exactly as before
   (localStorage + #c= kiosk link). */
var FIREBASE_CONFIG = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE_PROJECT_ID.firebaseapp.com",
  databaseURL: "https://PASTE_PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "PASTE_PROJECT_ID",
  storageBucket: "PASTE_PROJECT_ID.appspot.com",
  appId: "PASTE_APP_ID"
};
function firebaseReady() {
  return FIREBASE_CONFIG.apiKey.indexOf("PASTE") !== 0 && typeof firebase !== "undefined";
}

function defaultConfig() {
  return {
    pin: "1234",
    title: "Notice Board",
    rotationSecs: 10,
    notices: [
      { id: "n1", title: "Welcome to the Notice Board", body: "This is a sample notice.\nReplace it on the admin page (PIN 1234).", tag: "info", active: true },
      { id: "n2", title: "Sample: Team meeting at 4 PM", body: "Conference room. This is a sample — delete it on the admin page.", tag: "event", active: true }
    ]
  };
}
function b64e(s) {
  return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64d(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  return decodeURIComponent(escape(atob(s)));
}
function loadConfig() {
  var h = location.hash || "";
  if (h.indexOf("#c=") === 0) {
    try { return Object.assign(defaultConfig(), JSON.parse(b64d(h.slice(3)))); } catch (e) {}
  }
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw) return Object.assign(defaultConfig(), JSON.parse(raw));
  } catch (e) {}
  return defaultConfig();
}
function saveConfig(cfg) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(cfg)); } catch (e) {}
}
var CFG = loadConfig();
function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* ============ display view ============ */
var curIdx = 0, rotTimer = null;

function activeNotices() { return CFG.notices.filter(function (n) { return n.active; }); }

var qrReloadTimer = null;
/* The breaktime panel always embeds the live breaktime page itself — no
   settings, no options. The page refreshes its own code every ~10 minutes,
   and the frame is reloaded on the same cycle as a safety net. */
function renderQR() {
  var frame = document.getElementById("qr-frame");
  document.getElementById("qr-label").textContent = "Breaktime QR Code";
  var pageUrl = DEFAULT_QR;
  if (frame.getAttribute("src") !== pageUrl) frame.setAttribute("src", pageUrl);
  if (qrReloadTimer) clearInterval(qrReloadTimer);
  qrReloadTimer = setInterval(function () { frame.setAttribute("src", pageUrl); }, 10 * 60 * 1000);
}

function renderNotices() {
  var list = activeNotices(), wrap = document.getElementById("cards");
  var mainEl = document.querySelector("#display main");
  wrap.innerHTML = "";
  if (!list.length) {
    // No notices: show only the centered QR, no rotation timer.
    mainEl.classList.add("no-notices");
    if (rotTimer) { clearTimeout(rotTimer); rotTimer = null; }
    return;
  }
  mainEl.classList.remove("no-notices");
  if (curIdx >= list.length) curIdx = 0;
  list.forEach(function (n, i) {
    var d = document.createElement("div");
    d.className = "notice-card" + (i === curIdx ? " show" : "") + (n.img ? " has-img" : "");
    if (n.img) {
      d.innerHTML = '<div class="photo-overlay"><span class="tag ' + esc(n.tag || "info") + '">' + esc(n.tag || "info") + "</span>" +
        "<h2>" + esc(n.title) + "</h2><p>" + esc(n.body) + "</p></div>";
      d.style.backgroundImage = "url(" + JSON.stringify(n.img) + ")";
    } else {
      d.innerHTML = '<div class="notice-text"><span class="tag ' + esc(n.tag || "info") + '">' + esc(n.tag || "info") + "</span>" +
        "<h2>" + esc(n.title) + "</h2><p>" + esc(n.body) + "</p></div>";
    }
    wrap.appendChild(d);
  });
}

function showNotice(i) {
  var list = activeNotices();
  if (!list.length) return;
  curIdx = (i + list.length) % list.length;
  renderNotices();
  restartRotation();
}
function restartRotation() {
  if (rotTimer) clearTimeout(rotTimer);
  rotTimer = null;
  if (!activeNotices().length) return; // nothing to rotate: stay on the centered QR
  var secs = Math.max(4, Math.min(120, CFG.rotationSecs || 10));
  rotTimer = setTimeout(function () { showNotice(curIdx + 1); }, secs * 1000);
}
function tickClock() {
  var d = new Date(), el = document.querySelector("#clock .time"), dt = document.querySelector("#clock .date");
  var p = function (x) { return (x < 10 ? "0" : "") + x; };
  el.textContent = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  dt.textContent = d.toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}
function applyConfigToDisplay() {
  document.getElementById("board-title").textContent = CFG.title || "Notice Board";
  renderQR(); curIdx = 0; renderNotices(); restartRotation();
}
function initDisplay() {
  applyConfigToDisplay();
  tickClock();
  setInterval(tickClock, 1000);
  initLiveSync();
}
/* Live updates from Firebase (if configured). A #c= kiosk link always wins. */
function initLiveSync() {
  if (!firebaseReady()) return;
  if ((location.hash || "").indexOf("#c=") === 0) return;
  try {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    firebase.database().ref("noticeboard/config").on("value", function (snap) {
      var val = snap.val();
      if (val && typeof val === "object") {
        CFG = Object.assign(defaultConfig(), val);
        saveConfig(CFG);
        applyConfigToDisplay();
      }
    });
  } catch (e) { /* stay in local mode */ }
}

/* ============ boot ============ */
initDisplay();
</script>
</body>
</html>
